id: UEFI-T0038
name: Configuration Table Enumeration
type: technique
tactic: UEFI-TA9010
version_added: "1.0"
description: >
  UEFI firmware uses configuration tables to store information about system
  hardware and resources. Attackers enumerate these tables to gather details
  about the system's hardware components and configurations
evidence:
  - name: Unified Extensible Firmware Interface (UEFI) Specification Release 2.10
    year: 2022
    references:
      - https://uefi.org/sites/default/files/resources/UEFI_Spec_2_10_Aug29.pdf
countermeasures:
  - id: PM-03-03
    name: Access control to UEFI settings and features
    applicability: 1
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 1
  - id: DM-02-01
    name: Monitor for unusual activities
    applicability: 1
  - id: DM-02-02
    name: Conduct UEFI static analysis
    applicability: 1
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 1
risk:
  impact: 2
  likelihood: 3
  effectiveness: 1.00
  level: Low
