id: UEFI-T0025.001
name: Secure Boot Bypass
type: sub-technique
tactic: UEFI-TA9006
parent: UEFI-T0025
version_added: "1.0"
description: >
  Secure Boot ensures that only trusted and signed firmware, bootloaders, and
  drivers are executed during the boot process. Vulnerabilities in Secure
  Boot implementation enables threat actors to load and execute unsigned or
  malicious code, bypassing the integrity checks performed by Secure Boot
evidence:
  - name: "BlackLotus UEFI bootkit: Myth confirmed"
    year: 2022
    references:
      - https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/
  - name: "FinSpy: unseen findings"
    year: 2021
    references:
      - https://securelist.com/finspy-unseen-findings/104322/
