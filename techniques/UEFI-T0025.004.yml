id: UEFI-T0025.004
name: Bypassing UEFI Password
type: sub-technique
tactic: UEFI-TA9006
parent: UEFI-T0025
version_added: "1.0"
description: >
  Some systems allow users to set passwords to protect UEFI settings.
  Attackers use multiple techniques, such as dictionary/brute force attacks,
  keylogging, or social engineering, to bypass or recover these passwords,
  gaining administrative access and control over firmware settings
references:
  - https://eclypsium.com/research/firmware-security-realizations-part-3-spi-write-protections/
countermeasures:
  - id: PM-03-01
    name: Key management policy enforcement
    applicability: 1
  - id: PM-03-02
    name: Implement robust Authentication Protocols
    applicability: 2
  - id: PM-03-03
    name: Access control to UEFI settings and features
    applicability: 3
  - id: PM-03-04
    name: Disable USB Boot
    applicability: 1
  - id: PM-03-05
    name: Ensure Physical Security of Ports
    applicability: 1
  - id: PM-05-03
    name: Firmware integrity
    applicability: 1
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 1
  - id: DM-02-01
    name: Monitor for unusual activities
    applicability: 1
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 1
  - id: MM-01-02
    name: Analyze security feature bypass
    applicability: 2
  - id: MM-03-01
    name: Revoke compromised credentials
    applicability: 2
  - id: RM-01-03
    name: Restore credentials
    applicability: 2
risk:
  impact: 2
  likelihood: 3
  effectiveness: 1.50
  level: Low
