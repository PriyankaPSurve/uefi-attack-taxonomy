  - id: PM-01-09
    name: Memory integrity verification
    applicability: 2
  - id: PM-01-14
    name: Validate and restrict parsing of boot resources
    applicability: 2
  - id: PM-04-02
    name: Patch and Update the UEFI Regularly
    applicability: 3
  - id: PM-04-04
    name: Implement vulnerability management program
    applicability: 3
  - id: PM-05-03
