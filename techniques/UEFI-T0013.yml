id: UEFI-T0013
name: Overflow Vulnerability
type: technique
tactic: UEFI-TA9004
version_added: "1.0"
description: >
  Vulnerabilities can occur when inputs to UEFI system components are not
  properly validated, or when buffer limits are not enforced, causing data to
  overflow into adjacent memory regions. Attackers gain unauthorized access
  to such memory regions and misuse the sensitive information gathered from
  those regions
evidence:
  - name: "THERE'S A HOLE IN THE BOOT"
    year: 2020
    references:
      - https://eclypsium.com/blog/theres-a-hole-in-the-boot/
  - name: "BlackLotus UEFI bootkit: Myth confirmed"
    year: 2022
    references:
      - https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/
