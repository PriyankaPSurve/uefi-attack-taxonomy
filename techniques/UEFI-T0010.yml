id: UEFI-T0010
name: Compromise Remote Update
type: technique
tactic: UEFI-TA9003
version_added: "1.0"
description: >
  Attackers attempt to exploit vulnerabilities in the UEFI firmware update
  mechanism provided by the UEFI. An attacker can trick the system into
  accepting and applying a malicious update, delivering their payload into
  the UEFI
evidence:
  - name: "LoJax: First UEFI rootkit found in the wild, courtesy of the Sednit group"
    year: 2018
    references:
      - https://www.welivesecurity.com/2018/09/27/lojax-first-uefi-rootkit-found-wild-courtesy-sednit-group/
  - name: "Operation ShadowHammer: new supply chain attack threatens hundreds of thousands of users worldwide"
    year: 2019
    references:
      - https://www.kaspersky.com/about/press-releases/2019_operation-shadowhammer-new-supply-chain-attack
countermeasures:
  - id: PM-01-01
    name: Use Secure Boot
    applicability: 1
  - id: PM-01-02
    name: Implement UEFI image signing
    applicability: 3
  - id: PM-03-01
    name: Key management policy enforcement
    applicability: 2
  - id: PM-03-02
    name: Implement robust Authentication Protocols
    applicability: 2
  - id: PM-04-01
    name: Disable UEFI Version Rollback
    applicability: 2
  - id: PM-04-02
    name: Patch and Update the UEFI Regularly
    applicability: 2
  - id: PM-04-03
    name: Implement UEFI Version Control
    applicability: 2
  - id: PM-04-04
    name: Implement vulnerability management program
    applicability: 2
  - id: PM-04-05
    name: Verify integrity of update tools
    applicability: 3
  - id: PM-04-06
    name: Check signature before applying UEFI update
    applicability: 3
  - id: PM-04-07
    name: MFA for update process
    applicability: 3
  - id: PM-05-03
    name: Firmware integrity
    applicability: 2
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 2
  - id: DM-02-01
    name: Monitor for unusual activities
    applicability: 2
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 2
  - id: MM-02-02
    name: Disable compromised update paths
    applicability: 3
  - id: MM-03-01
    name: Revoke compromised credentials
