id: UEFI-T0008.002
name: Certificate Management
type: sub-technique
tactic: UEFI-TA9002
parent: UEFI-T0008
version_added: "1.0"
description: >
  Attackers acquire authentic digital certificates from vendors or generate
  their own to sign malicious UEFI code
evidence:
  - name: SHADOWHAMMER AND THE FIRMWARE SUPPLY CHAIN
    year: 2019
    references:
      - https://eclypsium.com/wp-content/uploads/ShadowHammer-and-the-Firmware-Supply-Chain.pdf
  - name: "UPDATE: Operation ShadowHammer – Compromised ASUS Computers"
    year: 2019
    references:
      - https://cert.europa.eu/publications/security-advisories/2019-007/
countermeasures:
  - id: PM-03-01
    name: Key management policy enforcement
    applicability: 3
  - id: PM-03-02
    name: Implement robust Authentication Protocols
    applicability: 2
  - id: PM-04-05
    name: Verify integrity of update tools
    applicability: 2
  - id: PM-04-06
    name: Check signature before applying UEFI update
    applicability: 3
  - id: PM-04-07
    name: MFA for update process
    applicability: 2
  - id: PM-05-03
    name: Firmware integrity
    applicability: 1
  - id: DM-02-02
    name: Conduct UEFI static analysis
    applicability: 1
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 1
  - id: MM-01-02
    name: Analyze security feature bypass
    applicability: 1
  - id: MM-03-02
    name: Revoke compromised cryptographic keys
    applicability: 3
  - id: RM-01-02
    name: Reissue cryptographic keys
    applicability: 3
risk:
  impact: 3
  likelihood: 2
  effectiveness: 2.00
  level: Low
