id: UEFI-T0009
name: Exploit Supply Chain
type: technique
tactic: UEFI-TA9003
version_added: "1.0"
description: >
  Attackers compromise supply-chain components of UEFI systems to deliver a
  malicious payload to the target system. This can be accomplished using the
  following sub-techniques
