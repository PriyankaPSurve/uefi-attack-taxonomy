id: UEFI-T0016.004
name: Boot Resource Parsing Exploitation
type: sub-technique
tactic: UEFI-TA9004
parent: UEFI-T0016
version_added: "1.1"
description: >
  Attackers supply a malformed data file that platform firmware parses during
  boot, causing memory corruption within the parser and yielding code
  execution in the firmware's own privilege context. This differs from
  Malicious Payload Injection (UEFI-T0016.003) in that no attacker-controlled
  code is introduced into the firmware image or the boot path: the injected
  artefact is data, and execution arises from a defect in the routine that
  interprets it. The parsers concerned are frequently third-party components
  executing in the DXE phase without the exploit mitigations customary in
  operating-system code. LogoFAIL is the principal documented instance, in
  which crafted boot logo images processed by vendor image parsers yielded
  execution during platform initialisation
evidence:
  - name: "Finding LogoFAIL: The Dangers of Image Parsing During System Boot"
    year: 2023
    references:
      - https://www.binarly.io/blog/finding-logofail-the-dangers-of-image-parsing-during-system-boot
  - name: Just about every Windows and Linux device vulnerable to new LogoFAIL firmware attack
    year: 2023
    references:
      - https://arstechnica.com/security/2023/12/just-about-every-windows-and-linux-device-vulnerable-to-new-logofail-firmware-attack/
