id: UEFI-T0016.002
name: Malicious Boot Loader Injection
type: sub-technique
tactic: UEFI-TA9004
parent: UEFI-T0016
version_added: "1.0"
description: >
  Attackers modify or replace the legitimate bootloader with a malicious one.
  The bootloader loads the operating system (OS) into memory and initiates
  system startup. Injecting a malicious bootloader can give attackers control
  over the boot process
evidence:
  - name: UEFI and Dreamboot
    year: 2013
  - name: "BlackLotus UEFI bootkit: Myth confirmed"
    year: 2022
    references:
      - https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/
  - name: "UEFI threats moving to the ESP: Introducing ESPecter bootkit"
    year: 2021
    references:
      - https://www.welivesecurity.com/2021/10/05/uefi-threats-moving-esp-introducing-especter-bootkit/
countermeasures:
  - id: PM-01-01
    name: Use Secure Boot
    applicability: 3
  - id: PM-01-02
    name: Implement UEFI image signing
    applicability: 2
  - id: PM-01-03
    name: BIOS integrity check
    applicability: 2
  - id: PM-01-08
    name: Boot order verification
    applicability: 2
  - id: PM-04-02
    name: Patch and Update the UEFI Regularly
    applicability: 1
  - id: PM-04-04
