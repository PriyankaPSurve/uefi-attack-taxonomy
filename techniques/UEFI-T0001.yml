id: UEFI-T0001
name: System Enumeration
type: technique
tactic: UEFI-TA9001
version_added: "1.0"
description: >
  Attackers aim to identify the target system's UEFI firmware version,
  vendor, and specific model . This information helps them understand the
  firmware's features, potential vulnerabilities, and available exploits
