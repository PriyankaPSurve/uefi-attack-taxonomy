id: UEFI-T0002
name: UEFI Code Analysis and Vulnerability Research
type: technique
tactic: UEFI-TA9001
version_added: "1.0"
description: >
  Threat actors analyze UEFI firmware code to identify potential security
  weaknesses, such as known issues in outdated firmware versions , known
  vulnerabilities , or misconfigurations
