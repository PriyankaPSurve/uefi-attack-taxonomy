    applicability: 1
  - id: PM-03-04
    name: Disable USB Boot
    applicability: 1
  - id: PM-03-05
    name: Ensure Physical Security of Ports
    applicability: 1
  - id: PM-05-03
    name: Firmware integrity
    applicability: 1
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 1
  - id: DM-02-01
    name: Monitor for unusual activities
    applicability: 1
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 1
risk:
  impact: 3
  likelihood: 4
  effectiveness: 1.12
  level: High
