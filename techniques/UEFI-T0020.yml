id: UEFI-T0020
name: Bootkit Installation
type: technique
tactic: UEFI-TA9005
version_added: "1.0"
description: >
  Establish persistence on a compromised system by embedding malicious code
  within the boot process, ensuring it executes each time the system starts
  up
