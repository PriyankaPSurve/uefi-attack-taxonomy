id: UEFI-T0029
name: Boot Configuration Analysis
type: technique
tactic: UEFI-TA9007
version_added: "1.0"
description: >
  Attackers explore the boot configuration settings in UEFI firmware, such as
  the boot order, boot options, and boot manager entries. This involves
  studying the boot process and associated components to identify weak points
  or misconfigurations. This information can be useful for post-exploitation
  manipulation of the boot process or alteration of boot parameters
evidence:
  - name: "BlackLotus UEFI bootkit: Myth confirmed"
    year: 2022
    references:
      - https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/
countermeasures:
  - id: PM-01-08
    name: Boot order verification
    applicability: 1
  - id: PM-03-03
    name: Access control to UEFI settings and features
    applicability: 1
  - id: PM-05-03
    name: Firmware integrity
    applicability: 1
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 1
  - id: DM-02-02
    name: Conduct UEFI static analysis
    applicability: 2
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 1
risk:
  impact: 3
  likelihood: 3
  effectiveness: 1.17
  level: Moderate
