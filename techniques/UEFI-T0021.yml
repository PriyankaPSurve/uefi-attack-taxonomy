id: UEFI-T0021
name: UEFI Variable Tampering
type: technique
tactic: UEFI-TA9005
version_added: "1.0"
description: >
  UEFI variable tampering ensures that the attacker's malicious
  configurations or code remain effective across multiple system reboots.
  Attacker does so by changing the variables containing individual boot
  entries and defining the paths to bootloader files, the order in which boot
  devices are accessed during the boot process, PK and KEK variables, etc
