id: UEFI-T0022
name: Hooking UEFI Services
type: technique
tactic: UEFI-TA9005
version_added: "1.0"
description: >
  UEFI runtime services provide various functions accessible even after the
  operating system has been booted. Attackers modify or "hook" these services
  by injecting malicious code or modifying existing service handlers.
  Handlers such as GetVariable and SetVariable are targeted to manipulate
  UEFI variables related to boot order, firmware settings, or security
  policies . LocateProtocol and LocateHandle are used to access specific
  firmware interfaces or to locate functions or resources.
  InstallProtocolInterface is exploited to introduce malicious code into
  protocols or interfaces. AllocatePages and FreePages allocate memory for
  code or data structures, ensuring persistence, while RaiseTPL is used to
  gain higher privileges by raising the Task Priority Level
