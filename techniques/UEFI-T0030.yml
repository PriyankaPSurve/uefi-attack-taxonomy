id: UEFI-T0030
name: Manipulating UEFI Variables
type: technique
tactic: UEFI-TA9008
version_added: "1.0"
description: >
  UEFI variables store system settings and configurations, including the
  security policy. Attackers manipulate these variables to change security
  settings, boot order, or other critical configurations, thereby escalating
  their privileges within the firmware environment
evidence:
  - name: "BlackLotus UEFI bootkit: Myth confirmed"
    year: 2022
    references:
      - https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/
  - name: Unified Extensible Firmware Interface (UEFI) Specification Release 2.10
    year: 2022
    references:
      - https://uefi.org/sites/default/files/resources/UEFI_Spec_2_10_Aug29.pdf
  - name: Extreme privilege escalation on Windows 8/UEFI systems
    year: 2014
countermeasures:
  - id: PM-01-08
    name: Boot order verification
    applicability: 1
  - id: PM-01-14
    name: Validate and restrict parsing of boot resources
    applicability: 1
  - id: PM-03-03
    name: Access control to UEFI settings and features
    applicability: 2
  - id: PM-03-04
    name: Disable USB Boot
    applicability: 1
  - id: PM-03-05
    name: Ensure Physical Security of Ports
    applicability: 1
  - id: PM-05-03
    name: Firmware integrity
    applicability: 1
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 2
  - id: DM-02-01
    name: Monitor for unusual activities
    applicability: 2
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 2
  - id: MM-01-02
    name: Analyze security feature bypass
    applicability: 1
  - id: RM-01-01
    name: Reflash UEFI
    applicability: 1
risk:
  impact: 3
  likelihood: 2
  effectiveness: 1.36
  level: Low
