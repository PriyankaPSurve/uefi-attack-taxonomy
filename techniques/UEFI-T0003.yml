id: UEFI-T0003
name: Hardware and UEFI Inventory
type: technique
tactic: UEFI-TA9001
version_added: "1.0"
description: >
  Threat actors gather information about the hardware components integrated
  into the system, such as the motherboard, chipset, storage devices, and
  network adapters. They also identify the firmware versions associated with
  these components, as outdated drivers can be potential entry points for
  exploitation . % Vulnerability Research (UEFI-T0005): Threat actors search
  for vulnerabilities specific to the UEFI firmware, associated components,
  or the system software stack. They may explore exploit databases, security
  advisories, or forums to uncover vulnerabilities or exploits; or perform
  their own original vulnerability research
evidence:
  - name: "TRICKBOT NOW OFFERS ‘TRICKBOOT’: PERSIST, BRICK, PROFIT"
    year: 2020
    references:
