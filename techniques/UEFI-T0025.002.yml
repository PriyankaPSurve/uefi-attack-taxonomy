id: UEFI-T0025.002
name: UEFI Security Policy Alteration
type: sub-technique
tactic: UEFI-TA9006
parent: UEFI-T0025
version_added: "1.0"
description: >
  Attackers perform unauthorized modifications or deletions of the UEFI
  security policies and settings related to Secure Boot, UEFI Secure Flash,
  platform key management, etc., to escalate privileges, establish
  persistence, or create a backdoor
evidence:
  - name: "BlackLotus UEFI bootkit: Myth confirmed"
    year: 2022
    references:
      - https://www.welivesecurity.com/2023/03/01/blacklotus-uefi-bootkit-myth-confirmed/
countermeasures:
  - id: PM-03-01
    name: Key management policy enforcement
    applicability: 1
  - id: PM-03-02
    name: Implement robust Authentication Protocols
    applicability: 1
  - id: PM-03-03
    name: Access control to UEFI settings and features
    applicability: 3
  - id: PM-04-01
    name: Disable UEFI Version Rollback
    applicability: 1
  - id: PM-04-02
    name: Patch and Update the UEFI Regularly
    applicability: 1
  - id: PM-05-03
    name: Firmware integrity
    applicability: 2
  - id: DM-01-07
    name: Monitor UEFI logs
    applicability: 2
  - id: DM-02-01
    name: Monitor for unusual activities
    applicability: 2
  - id: MM-01-01
    name: Investigation of Suspicious Activities
    applicability: 2
  - id: MM-01-02
    name: Analyze security feature bypass
    applicability: 3
  - id: MM-03-01
    name: Revoke compromised credentials
    applicability: 1
  - id: RM-01-01
    name: Reflash UEFI
    applicability: 1
  - id: RM-01-03
    name: Restore credentials
    applicability: 1
risk:
  impact: 4
  likelihood: 4
  effectiveness: 1.62
  level: Very high
