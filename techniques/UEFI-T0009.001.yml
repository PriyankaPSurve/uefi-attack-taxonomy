id: UEFI-T0009.001
name: Software Supply Chain
type: sub-technique
tactic: UEFI-TA9003
parent: UEFI-T0009
version_added: "1.0"
description: >
  Attackers hijack the UEFI firmware development and distribution mechanism
evidence:
  - name: "Operation ShadowHammer: new supply chain attack threatens hundreds of thousands of users worldwide"
    year: 2019
    references:
      - https://www.kaspersky.com/about/press-releases/2019_operation-shadowhammer-new-supply-chain-attack
  - name: "Operation ShadowHammer: a high-profile supply chain attack"
    year: 2019
    references:
      - https://securelist.com/operation-shadowhammer-a-high-profile-supply-chain-attack/90380/
  - name: "YET ANOTHER UEFI BOOTKIT DISCOVERED: MEET COSMICSTRAND"
    year: 2022
    references:
      - https://eclypsium.com/blog/yet-another-uefi-bootkit-discovered-meet-cosmicstrand/
  - name: "LoJax: First UEFI rootkit found in the wild, courtesy of the Sednit group"
    year: 2018
    references:
      - https://www.welivesecurity.com/2018/09/27/lojax-first-uefi-rootkit-found-wild-courtesy-sednit-group/
countermeasures:
  - id: PM-02-01
    name: Assess and audit vendors in the UEFI supply chain
    applicability: 2
  - id: PM-02-02
    name: Use secure, traceable supply chain method
    applicability: 1
  - id: PM-02-03
    name: Use components from trusted sources only
    applicability: 2
  - id: PM-02-04
    name: 3rd party component integrity check
    applicability: 2
  - id: PM-02-05
    name: Incorporate SBOM into SSDLC
    applicability: 3
  - id: PM-04-03
    name: Implement UEFI Version Control
    applicability: 1
  - id: PM-04-04
    name: Implement vulnerability management program
    applicability: 2
  - id: PM-04-05
    name: Verify integrity of update tools
    applicability: 2
  - id: PM-05-03
    name: Firmware integrity
    applicability: 1
  - id: DM-02-02
    name: Conduct UEFI static analysis
    applicability: 2
  - id: MM-01-03
    name: Analyze supply chain impact
    applicability: 2
risk:
  impact: 4
  likelihood: 3
  effectiveness: 1.82
  level: High
